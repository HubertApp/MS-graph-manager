services:
  app:
    build: .
    container_name: ms-graph-manager-api
    ports:
      - "8003:80"
    volumes:
      - .:/project
    command: "uvicorn app.main:app --host 0.0.0.0 --port 80 --reload --reload-dir /project"
    environment:
      - OSRM_BASE_URL=http://host.docker.internal:5000
    networks:
      - ms-graph-manager-network

networks:
  ms-graph-manager-network:
    driver: bridge
