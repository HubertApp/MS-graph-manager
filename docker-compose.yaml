services:

  graph-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-graph-manager
    labels:
      logging: "enabled"
      service: "graph-manager"
    ports:
      - "3011:3011"
    environment:
      PORT: 3011
      LOG_LEVEL: INFO
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: graph-manager
      OTEL_RESOURCE_ATTRIBUTES: service.name=graph-manager,deployment.environment=development

      OSRM_BASE_URL: http://osrm:5000
      TRAFFIC_INFO_URL: ${TRAFFIC_INFO_URL:-}
      PREDICTIVE_INFO_URL: ${PREDICTIVE_INFO_URL:-}
      CPP_ROUTER_GRPC_TARGET: ${CPP_ROUTER_GRPC_TARGET:-envoy:50051}
      CPP_ROUTER_TIMEOUT_S: ${CPP_ROUTER_TIMEOUT_S:-10.0}
      TRACKING_SERVICE_URL: ${TRACKING_SERVICE_URL:-}
      OSMNX_GRAPH_MARGIN_M: ${OSMNX_GRAPH_MARGIN_M:-1500}

      # Cache regional du graphe OSM : les regions telechargees sont gardees
      # dans le volume graph-manager-cache (un redemarrage ne retelecharge
      # rien). Metz est prechargee au demarrage, en tache de fond : la
      # premiere recherche n'attend pas Overpass. Vider pour desactiver.
      OSMNX_CACHE_DIR: /app/cache/graphs
      OSMNX_PRELOAD_BBOXES: ${OSMNX_PRELOAD_BBOXES-6.10,49.06,6.27,49.16}
      OSMNX_PRELOAD_NETWORK_TYPES: ${OSMNX_PRELOAD_NETWORK_TYPES:-walk,drive}

      # Couche transport en commun : lue directement sur le subgraph de
      # MS-aom-agregator (pas via la gateway). Reseaux decouverts
      # automatiquement ; TRANSIT_NETWORK_IDS sert de liste blanche.
      AOM_GRAPHQL_URL: ${AOM_GRAPHQL_URL:-http://service-aom-agregator:80/graphql}
      TRANSIT_NETWORK_IDS: ${TRANSIT_NETWORK_IDS:-}
      TRANSIT_ACCESS_RADIUS_M: ${TRANSIT_ACCESS_RADIUS_M:-400}

      # Evenement gtfs.network.ingested publie par MS-aom-agregator :
      # recharge la couche transit apres chaque ingestion.
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
    volumes:
      - graph-manager-cache:/app/cache
    networks:
      - hubert-network
      - graph-manager-network
      - astar-net

  osrm:
    image: osrm/osrm-backend
    container_name: ms-graph-manager-osrm
    command: >
      osrm-routed --algorithm mld /data/${OSRM_PBF_NAME:-map}.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    networks:
      - graph-manager-network

volumes:
  graph-manager-cache:

networks:
  hubert-network:
    external: true

  graph-manager-network:
    driver: bridge

  astar-net:
    external: true
    name: astar-net