services:
  graph-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-graph-manager
    ports:
      - "8003:80"
    environment:
      OSRM_BASE_URL: http://osrm:5000
      TRAFFIC_INFO_URL: ${TRAFFIC_INFO_URL:-}
      PREDICTIVE_INFO_URL: ${PREDICTIVE_INFO_URL:-}
      CPP_ROUTER_GRPC_TARGET: ${CPP_ROUTER_GRPC_TARGET:-host.docker.internal:50051}
      TRACKING_SERVICE_URL: ${TRACKING_SERVICE_URL:-}
      OSMNX_GRAPH_MARGIN_M: ${OSMNX_GRAPH_MARGIN_M:-1500}
    networks:
      - graph-manager-network

  # Optionnel : nécessite des données déjà extraites (osrm-extract/partition/customize,
  # voir README) déposées dans ./osrm-data. Sans ce service, le fallback OSRM
  # échoue simplement et le calcul repose entièrement sur osmnx.
  osrm:
    image: osrm/osrm-backend
    container_name: ms-graph-manager-osrm
    command: >
      osrm-routed --algorithm mld /data/${OSRM_PBF_NAME:-map}.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    networks:
      - graph-manager-network

networks:
  graph-manager-network:
    driver: bridge
