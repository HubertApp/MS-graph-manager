# Configuration de l'Automatic Analysis de SonarQube Cloud (l'App GitHub lit le
# code directement, aucun scanner ni token dans la CI).
# Ce mode n'importe pas la couverture de tests : le seuil de 90 % reste tenu par
# `make test`, pas par Sonar.

# Stubs générés par protoc : ni édités, ni à analyser.
sonar.exclusions=app/proto/**
